name: CI 
on: 
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Docker build
        uses: docker/setup-buildx-action@v3
      
      - name: asd
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mvc-flask-pymongo-app:latest
      

