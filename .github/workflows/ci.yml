name: CI 
on: 
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Docker compose build
        run: docker compose up -d --build
      

      - name: asd
        run: |
          sleep 10
          curl -v -f http://localhost:5001/todos/
      

