apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:         
    metadata:       
      labels:
        app: app
    spec:
      containers:
      - name: python
        image: mvc-flask-pymongo-app:latest
        imagePullPolicy: Never                      
        ports:
        - containerPort: 5000                   